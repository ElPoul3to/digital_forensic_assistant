[project]
name = "digital-forensic-assistant"
version = "0.1.0"
description = "Retrieve & rerank RAG assistant for cyber incident response analysts"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "ollama>=0.3",
    "qdrant-client>=1.12",
    "torch>=2.3",
    "transformers>=4.51",
    "sentence-transformers>=3.0",
    "duckdb>=1.0",
    "python-dateutil>=2.9",
    "orjson>=3.10",
    "pytz>=2024.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.optional-dependencies]
parsers = [
    "python-evtx>=0.8",
    "scapy>=2.5",
]
disk = [
    "dissect.target>=3.20",
    "dissect.shellitem>=3",
    "dissect.extfs>=3",
    "dissect.fat>=3",
    "dissect.xfs>=3",
    "dissect.ole>=3",
]
memory = [
    "volatility3>=2.20",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
all = ["digital-forensic-assistant[parsers,disk,memory,dev]"]

[project.scripts]
dfa = "dfa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/dfa/cli.py" = ["B008"]  # typer.Option/Argument defaults are the documented idiom
"src/dfa/api/*.py" = ["B008"]  # fastapi.Depends defaults are the documented idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
